name: Compilar APK

on:
  push:
    branches: [mundonet-m3u, main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Aceptar licencias del SDK de Android
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Compilar celular y TV
        run: ./gradlew :app:smartphone:assembleRelease :app:tv:assembleRelease --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: mundoNET-apk
          if-no-files-found: error
          path: |
            app/smartphone/build/outputs/published-apk/release/*.apk
            app/tv/build/outputs/published-apk/release/*.apk
